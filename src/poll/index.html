<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/home.css">
    <link rel="stylesheet" href="/styles/my-club-large.css"/>
    <script src="poll.mjs" type="module"></script>
    <title>My Club</title>
</head>
<body>
    <header id="main-header"></header>
    </body>
    <h1>Create a poll</h1>

<div class="read-block" data-key="readBooks">
    <h2>Add a book to the poll</h2>
    <section class="search-section">
        <form class="search-form">
            <input type="text" class="search-input" placeholder="Enter book title" required>
            <button type="submit">Search</button>
        </form>
        <div class="search-results"></div>
    </section>  

    <section class="read-books-section">
        <div class="read-books-container books-grid"></div>
    </section>
    </div>

    <div class="poll">
        <div class="question"></div>
        <div class="answers"></div>
    </div>


    <footer id="main-footer"></footer>
</body>
</html>
