<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/home.css">
    <link rel="stylesheet" href="/styles/my-club-large.css"/>
    <title>My Club</title>
</head>
<body>
    <header>
        <img src="/images/logo.svg" alt="Site Logo" width="64" height="64">
        <span>Reading Club</span>
        <button id="nav-button" class="hamburguer" aria-label="navigation"></button>
    </header>
    <h1>My Club</h1>

    <form id="register-form">
        <fieldset>
            <legend>Register My Club</legend>
            <fieldset>
            <legend>Name of the group</legend>
            <label><input type="text" name="gname" id="gname" required/></label>
    </fieldset>
            <fieldset>
            <legend>About Us</legend>
            <label><input type="text" name="about" placeholder="Tell us about your group" id="about"/></label>
       </fieldset>  
       <fieldset> 
            <legend>Type of group</legend>
            <label><input type="radio" name="family" value="family" id="type"/> Family</label>
            <label><input type="radio" name="family" value="family" id="type"/> Friends</label>
            <label><input type="radio" name="type" value="other" id="type"> Other</label>
            </fieldset>  

            <fieldset>
            <legend>Group Size</legend>
            <select required>
                <option value="" disabled selected hidden>Select group size</option>
                <option value="two" id="size">Two</option>
                <option value="three" id="size">Three</option>
                <option value="four" id="size">Four</option>
                <option value="more" id="size">Five or more</option>
            </select>
            </fieldset>
        </fieldset>    
        <button type="submit">Register</button>
    </form>
    
</body>
</html>
