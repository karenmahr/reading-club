<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/home.css">
    <link rel="stylesheet" href="/styles/my-club-large.css"/>
    <script src="my-books.mjs" type="module"></script>
    <title>My Books</title>
</head>
<body>
    <header id="main-header"></header>
    
    <h1>My Books</h1>

<div class="read">
    <h2>Books I've Read</h2>

    <section class="search-section">
        <h3>Find a Book</h3>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Enter book title" required>
            <button type="submit">Search</button>
        </form>
        <div id="search-results"></div>
    </section>     

    <section class="read-books-section">
        <div id="read-books-container" class="books-grid"></div>
    </section>

</div>   

<div class="read">
    <h2>Books I'm reading</h2>

    <section class="search-section">
        <h3>Find a Book</h3>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Enter book title" required>
            <button type="submit">Search</button>
        </form>
        <div id="search-results"></div>
    </section>   

    <section class="read-books-section">
        <div id="read-books-container" class="books-grid"></div>
    </section>
</div>  

<div class="read">
    <h2>Books I want to read</h2>
    
    <section class="search-section">
        <h3>Find a Book</h3>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Enter book title" required>
            <button type="submit">Search</button>
        </form>
        <div id="search-results"></div>
    </section> 

    <section class="read-books-section">
        <div id="read-books-container" class="books-grid"></div>
    </section>

</div>  
    
    <footer id="main-footer"></footer>
</body>
</html>
