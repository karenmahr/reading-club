<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/my-club.css"/>
    <link rel="stylesheet" href="/styles/my-club-large.css"/>
    <title>My Club</title>
</head>
<body>
    <header>
        <img src="/images/logo.svg" alt="Site Logo" width="64" height="64">
        <span>Reading Club</span>
        <button id="nav-button" class="hamburguer" aria-label="navigation"></button>
    </header>
    <h1>My Club</h1>

    <form id="register-form">
        <fieldset>
            <legend>Register My Club</legend>
            <label>Name of the group <input type="text" name="gname" required /></label>
            <label>About us <input type="text" name="about" placeholder="Tell us about your group" /></label>
            <label>Group Size <input type="select" name="size" required /></label>
            <label>Type of group <input type="radio" name="type" /></label>
        </fieldset>    
        <button type="submit">Register</button>
    </form>
    
</body>
</html>
